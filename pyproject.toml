[tool.poetry]
name = "blogapp"
version = "0.1.0"
description = "final project"
authors = ["Lytkina Tatiana <tilytkina@edu.hse.ru>"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.110.0"
uvicorn = "^0.29.0"
jinja2 = "^3.1.3"
python-multipart = "^0.0.9"
markdown2 = "^2.4.13"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
black = "^24.0.0"
isort = "^5.13.0"
flake8 = "^6.1.0"
mypy = "^1.8.0"
pytest-cov = "^5.0"
playwright = "^1.47"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["blog_app"]

