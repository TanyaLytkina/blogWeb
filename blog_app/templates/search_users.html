{% extends "base.html" %}
{% block content %}
<h2>Поиск пользователей</h2>
<form class="mb-4" method="GET">
    <div class="input-group">
        <input type="text" name="q" class="form-control" placeholder="Логин…" value="{{ q }}">
        <button class="btn btn-outline-secondary">🔍 Найти</button>
    </div>
</form>

{% if q %}
{% if users %}
<div class="row">
    {% for u in users %}
    <div class="col-md-4 mb-3">
        <div class="card"><div class="card-body"><h5>@{{ u.login }}</h5><p>{{ u.email }}</p></div></div>
    </div>
    {% endfor %}
</div>
{% else %}
<div class="alert alert-info">Ничего не найдено</div>
{% endif %}
{% endif %}
{% endblock %}
