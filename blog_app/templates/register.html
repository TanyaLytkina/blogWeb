{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-header"><h4>Регистрация</h4></div>
      <div class="card-body">
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="POST">
          <div class="mb-3"><label>Email</label><input type="email" name="email" class="form-control" required></div>
          <div class="mb-3"><label>Логин</label><input name="login" class="form-control" required></div>
          <div class="mb-3"><label>Пароль (≥4)</label><input type="password" name="password" class="form-control" minlength="4" required></div>
          <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
          <a href="/login" class="btn btn-link">Уже есть аккаунтик?</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
